name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config bubblewrap

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.ref == 'refs/heads/main' && 'bazel-disk' || '' }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --config=ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.ref == 'refs/heads/main' && 'bazel-disk-lint' || '' }}
          repository-cache: true

      - name: Clippy check
        run: bazel build //... --config=clippy

      - name: Rustfmt check
        run: bazel build //... --config=rustfmt

  boundary:
    name: Architectural boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: loopal-message crate must not exist (deleted in PR-6)
        run: |
          set -e
          if [ -d "crates/loopal-message" ]; then
            echo "PR-6 boundary violated: crates/loopal-message must be deleted"
            exit 1
          fi
          if grep -rn '\buse loopal_message::' crates/ src/ 2>/dev/null; then
            echo "PR-6 boundary violated: source files still import loopal_message"
            exit 1
          fi
          if grep -rn '//crates/loopal-message' crates/ src/ BUILD.bazel 2>/dev/null; then
            echo "PR-6 boundary violated: BUILD.bazel files still depend on loopal-message"
            exit 1
          fi
          echo "OK: loopal-message crate fully removed."

      - name: Protocol crate must not depend on loopal-message
        run: |
          set -e
          if grep -n 'loopal-message\b' crates/loopal-protocol/BUILD.bazel; then
            echo "PR-5b boundary violated: loopal-protocol/BUILD.bazel must not depend on loopal-message"
            exit 1
          fi
          if grep -rn '\buse loopal_message\b' crates/loopal-protocol/src; then
            echo "PR-5b boundary violated: loopal-protocol/src imports loopal_message"
            exit 1
          fi
          # MessageRole / ContentBlock are wire-format names; only McpContentBlock is allowed.
          if grep -rn '\bMessageRole\b\|\bContentBlock\b' crates/loopal-protocol/src | grep -v 'McpContentBlock' | grep -q .; then
            echo "PR-5b boundary violated: protocol src uses wire-format type names"
            exit 1
          fi
          echo "OK: loopal-protocol boundary clean."

      - name: Event payload field naming uses envelope_id (not message_id)
        run: |
          set -e
          # `message_id` MUST NOT appear within the InboxEnqueued / InboxConsumed /
          # UserMessageQueued variants (it would re-introduce the wire-format leak).
          if grep -A 5 'InboxEnqueued\s*{\|InboxConsumed\s*{\|UserMessageQueued\s*{' \
              crates/loopal-protocol/src/event_payload.rs \
            | grep -q 'message_id'; then
            echo "PR-5b boundary violated: event_payload reintroduced message_id field"
            exit 1
          fi
          echo "OK: event_payload uses envelope_id."
